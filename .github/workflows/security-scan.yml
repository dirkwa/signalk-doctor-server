name: Security Scan

# Trivy CVE scan of the published image.
#
# Scans `:latest`, the newest release an install can switch to, in two
# layers:
#   - npm packages baked into node_modules (the build/deps stages)
#   - the node:24-trixie-slim base + the apt packages the runtime stage
#     installs (tini, ca-certificates, systemd, dbus)
# A newly-disclosed CVE in the base or those packages surfaces here even when
# no code changed — coverage neither `npm audit` nor Dependabot provides.
# Scanning the release rather than a fresh build makes an open alert mean
# the released image is affected, and it stays open until a release ships
# the fix. Every published architecture is scanned: the Node image builds
# each one separately, so their packages can differ.
#
# Runs weekly (not on PRs) so freshly-disclosed CVEs surface without adding an
# image pull to every PR. Results land in the Security → Code scanning tab.
#
# ignore-unfixed drops CVEs with no fixed version (e.g. kernel headers) —
# noise we cannot resolve here. Every other finding is actionable, whatever
# its severity, and there is deliberately no severity filter: Debian security
# advisories often carry none. What fixes one depends on where it sits:
#   - a Debian package: the next release (the runtime stage upgrades them)
#   - an npm package: the next release, when the fix is inside the range in
#     package.json (no lockfile is committed, so the build resolves fresh);
#     otherwise a dependency bump
#   - the Node runtime: a release after the node:24 base is rebuilt upstream
# This is informational; it does not gate anything.

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

# A manual dispatch can overlap the weekly run; both upload the same SARIF
# categories, so cancel an older in-progress scan.
concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    if: github.repository == 'dirkwa/signalk-doctor-server'
    name: Security Scan (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 keeps the category the scan has always uploaded, so its
          # existing alerts update in place.
          - arch: amd64
            category: trivy-docker
          - arch: arm64
            category: trivy-docker-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # No later step performs git operations — don't leave the token
          # in the workspace.
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # The action has no platform input; Trivy reads every flag from a
          # TRIVY_* variable, --platform included.
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: 'ghcr.io/${{ github.repository }}:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        # always() so a scan that finds CVEs (non-zero) still uploads, but
        # guard on the file existing so a build/scan failure surfaces its own
        # error instead of failing here on a missing SARIF.
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: ${{ matrix.category }}
